<!-- online-users.component.html -->
<div class="card">
  <div class="card-content">
    <span class="card-title">
      Utilisateurs connectés
      <span class="new badge blue" data-badge-caption="en ligne">{{
        users().length
      }}</span>
    </span>
    <table class="highlight responsive-table">
      <thead>
        <tr>
          <th>Utilisateur</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Durée de connexion</th>
        </tr>
      </thead>
      <tbody>
        @for (u of users(); track u.user_id) {
          <tr>
            <td>
              <strong>{{ u.full_name }}</strong
              ><br />
              <span class="grey-text text-darken-1">{{ u.username }}</span>
            </td>
            <td>{{ u.role || "—" }}</td>
            <td>
              <span
                class="status-dot"
                [class.online]="u.status === 'online'"
                [class.idle]="u.status === 'idle'"
              ></span>
              {{ u.status === "online" ? "Actif" : "Inactif" }}
            </td>
            <td>{{ elapsed(u) }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="center-align grey-text">
              Aucun utilisateur connecté
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
