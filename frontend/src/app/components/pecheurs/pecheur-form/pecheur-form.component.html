<div class="page-header">
  <div class="container-fluid">
    <h1>
      <i class="material-icons left">{{
        isEditMode ? "edit" : "person_add"
      }}</i>
      {{ isEditMode ? "Modifier" : "Nouveau" }} pêcheur
    </h1>
  </div>
</div>

<div class="container-fluid">
  <div class="card">
    <div class="card-content">
      <form (ngSubmit)="savePecheur()" #pecheurForm="ngForm">
        <!-- Informations de base -->
        <h5>
          Informations civiles
          <i class="required_field">(* Champs obligatoires)</i>
        </h5>

        <div class="row">
          <div class="input-field col s12 m6">
            <input
              id="nom"
              type="text"
              [(ngModel)]="formData.nom"
              name="nom"
              required
            />
            <label for="nom">Nom <i class="required_field">* </i></label>
          </div>
          <div class="input-field col s12 m6">
            <input
              id="prenom"
              type="text"
              [(ngModel)]="formData.prenom"
              name="prenom"
            />
            <label for="prenom">Prénom</label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12 m4">
            <input
              id="date_naissance"
              type="date"
              [(ngModel)]="formData.date_naissance"
              name="date_naissance"
              required
            />
            <label for="date_naissance" class="active"
              >Date de naissance <i class="required_field">* </i></label
            >
          </div>
          <div class="input-field col s12 m4">
            <input
              id="lieu_naissance"
              type="text"
              [(ngModel)]="formData.lieu_naissance"
              name="lieu_naissance"
            />
            <label for="lieu_naissance">Lieu de naissance</label>
          </div>
          <div class="input-field col s12 m4">
            <select
              [(ngModel)]="formData.nationalite"
              name="nationalite"
              required
            >
              <option value="" disabled>Choisir la nationalié</option>
              <option value="Gabonaise">Gabonaise</option>
              <option value="Nigériane">Nigériane</option>
              <option value="Béninoise">Béninoise</option>
              <option value="Ghanéenne">Ghanéenne</option>
              <option value="Malienne">Malienne</option>
              <option value="Togolaise">Togolaise</option>
              <option value="Camerounaise">Camerounaise</option>
            </select>
            <label>Nationalité <i class="required_field">* </i></label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12 m4">
            <input
              id="telephone"
              type="tel"
              [(ngModel)]="formData.telephone"
              name="telephone"
            />
            <label for="telephone">Téléphone</label>
          </div>
          <div class="input-field col s12 m4">
            <input
              id="email"
              type="email"
              [(ngModel)]="formData.email"
              name="email"
            />
            <label for="email">Email</label>
          </div>
          <div class="input-field col s4">
            <input
              id="adresse"
              type="text"
              [(ngModel)]="formData.adresse"
              name="adresse"
            />
            <label for="adresse">Adresse</label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12 m4">
            <select
              [(ngModel)]="formData.type_carte"
              name="type_carte"
              required
            >
              <option value="" disabled>
                Choisir le type de pièce d'identité
              </option>
              <option value="Carte Nationale d'Identité">
                Carte Nationale d'Identité
              </option>
              <option value="Carte de séjour">Carte de séjour</option>
              <option value="Passeport">Passeport</option>
            </select>
            <label
              >Type de pièce d'identité <i class="required_field">* </i></label
            >
          </div>
          <div class="input-field col s12 m4">
            <input
              id="numero_piece_identite"
              type="text"
              [(ngModel)]="formData.numero_piece_identite"
              name="numero_piece_identite"
              placeholder="Numero de la pièce"
              required
            />
            <label for="numero_piece_identite"
              >Numéro de la pièce <i class="required_field">* </i></label
            >
          </div>
        </div>

        <!-- Catégorisation -->
        <h5 class="mt-3">
          Catégorisation professionnelle
          <i class="required_field">(* Champs obligatoires)</i>
        </h5>
        <div class="row">
          <div class="input-field col s12 m4">
            <select [(ngModel)]="formData.categorie" name="categorie" required>
              <option value="" disabled>Choisir la catégorie</option>
              <option value="Pêcheur artisanal">Pêcheur artisanal</option>
              <option value="Pêcheur semi-industriel">
                Pêcheur semi-industriel
              </option>
              <option value="Propriétaire de bateau">
                Propriétaire de bateau
              </option>
              <option value="Aide-pêcheur">Aide-pêcheur</option>
            </select>
            <label>Catégorie <i class="required_field">* </i></label>
          </div>

          <div class="input-field col s12 m4">
            <select [(ngModel)]="formData.statut" name="statut" required>
              <option value="" disabled>Choisir le statut</option>
              <option value="Actif">Actif</option>
              <option value="Inactif">Inactif</option>
              <option value="Suspendu">Suspendu</option>
            </select>
            <label>Statut <i class="required_field">* </i></label>
          </div>
          <div class="input-field col s12 m4">
            <input
              id="debarcadere"
              type="text"
              [(ngModel)]="formData.debarcadere_habituel_code"
              name="debarcadere"
            />
            <label for="debarcadere">Code débarcadère habituel</label>
            <span class="helper-text">Ex: GA-EST-DEB-001</span>
          </div>
        </div>

        <!-- Section Photo -->
        <div class="col s12">
          <div class="card">
            <div class="card-content">
              <span class="card-title">
                <i class="material-icons left">portrait</i>
                Photo du pêcheur
              </span>

              <!-- Composant Photo Uploader -->
              <app-photo-uploader
                (photoSelected)="onPhotoSelected($event)"
                (photoRemoved)="onPhotoRemoved()"
              >
              </app-photo-uploader>
            </div>
          </div>
        </div>

        <!-- Contacts d'urgence -->
        <h5 class="mt-3">Contact d'urgence</h5>
        <div class="row">
          <div class="input-field col s12 m4">
            <input
              id="urgence_nom"
              type="text"
              [(ngModel)]="formData.contact_urgence_nom"
              name="urgence_nom"
            />
            <label for="urgence_nom">Nom du contact</label>
          </div>
          <div class="input-field col s12 m4">
            <input
              id="urgence_tel"
              type="tel"
              [(ngModel)]="formData.contact_urgence_telephone"
              name="urgence_tel"
            />
            <label for="urgence_tel">Téléphone d'urgence</label>
          </div>
          <div class="input-field col s12 m4">
            <input
              id="urgence_relation"
              type="text"
              [(ngModel)]="formData.contact_urgence_relation"
              name="urgence_relation"
            />
            <label for="urgence_relation">Relation</label>
            <span class="helper-text">Ex: Épouse, Frère, etc.</span>
          </div>
        </div>

        <!-- Boutons d'action -->
        <div class="row">
          <div class="col s12">
            <button
              type="submit"
              class="btn btn-primary waves-effect waves-light"
              [disabled]="!pecheurForm.form.valid"
            >
              <i class="material-icons left">save</i>
              {{ isEditMode ? "Mettre à jour" : "Créer" }}
            </button>
            <a
              routerLink="/pecheurs"
              class="btn btn-flat waves-effect waves-light ml-2"
            >
              <i class="material-icons left">cancel</i>
              Annuler
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
